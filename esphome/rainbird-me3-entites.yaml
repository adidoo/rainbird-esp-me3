button:
  - platform: template
    name: Arrêter l'arrosage
    icon: mdi:water-off
    on_press:
      - lambda: 'id(rainbird).stop_irrigation();'
  - platform: template
    name: Zone suivante
    icon: mdi:skip-next
    on_press:
      - lambda: 'id(rainbird).advance_zone();'
  - platform: template
    name: Tester toutes les zones
    icon: mdi:test-tube
    on_press:
      - lambda: 'id(rainbird).test_all_zones((int) id(duree_test).state);'
  - platform: template
    name: Mettre à l'heure
    icon: mdi:clock-check-outline
    on_press:
      - lambda: |-
          auto t = id(heure_ha).now();
          if (t.is_valid())
            id(rainbird).set_clock(t.hour, t.minute, t.second, t.day_of_month, t.month, t.year);
  - platform: template
    name: Relire la configuration
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rainbird).request_config();'
  - platform: restart
    name: Redémarrer
  - platform: template
    name: Lancer le programme A
    icon: mdi:play-circle-outline
    on_press:
      - lambda: 'id(rainbird).run_program(0);'
  - platform: template
    name: Lancer le programme B
    icon: mdi:play-circle-outline
    on_press:
      - lambda: 'id(rainbird).run_program(1);'
  - platform: template
    name: Lancer le programme C
    icon: mdi:play-circle-outline
    on_press:
      - lambda: 'id(rainbird).run_program(2);'
  - platform: template
    name: Lancer le programme D
    icon: mdi:play-circle-outline
    on_press:
      - lambda: 'id(rainbird).run_program(3);'
