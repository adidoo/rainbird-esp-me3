switch:
  # Safeguard: while it is off, only reads (and stop) are sent to the controller.
  - platform: template
    name: Commandes autorisées
    id: commandes_autorisees
    icon: mdi:shield-lock-open
    restore_mode: ALWAYS_OFF
    optimistic: true
    on_turn_on:
      - lambda: 'id(rainbird).set_commands_allowed(true);'
    on_turn_off:
      - lambda: 'id(rainbird).set_commands_allowed(false);'
  # Diagnostic: the board stays silent and only listens to the line
  - platform: template
    name: Écoute seule
    id: ecoute_seule
    icon: mdi:ear-hearing
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF
    optimistic: true
    on_turn_on:
      - lambda: 'id(rainbird).set_listen_only(true);'
    on_turn_off:
      - lambda: 'id(rainbird).set_listen_only(false);'
  # On: a zone started during irrigation is added to the queue (4B) instead of replacing it (39)
  - platform: template
    name: File d'attente
    id: file_attente
    icon: mdi:playlist-plus
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
  - platform: template
    name: Sonde de pluie active
    icon: mdi:weather-rainy
    restore_mode: DISABLED
    lambda: |-
      if (!id(rainbird).config_loaded()) return {};
      return id(rainbird).rain_sensor_enabled();
    turn_on_action:
      - lambda: 'id(rainbird).set_rain_sensor_enabled(true);'
    turn_off_action:
      - lambda: 'id(rainbird).set_rain_sensor_enabled(false);'
  - platform: template
    name: Zone 1
    id: zone_1
    icon: mdi:sprinkler
    restore_mode: DISABLED
    lambda: 'return id(rainbird).zone_active(1);'
    turn_on_action:
      - lambda: |-
          int minutes = (int) id(duree_manuelle).state;
          if (id(file_attente).state && id(rainbird).irrigating())
            id(rainbird).stack_zone(1, minutes);
          else
            id(rainbird).run_zone(1, minutes);
    turn_off_action:
      - lambda: |-
          if (!id(rainbird).zone_active(1)) return;
          if (id(file_attente).state)
            id(rainbird).advance_zone();
          else
            id(rainbird).stop_irrigation();
  - platform: template
    name: Zone 2
    id: zone_2
    icon: mdi:sprinkler
