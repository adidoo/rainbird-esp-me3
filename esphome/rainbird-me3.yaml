# Replacement of the LNK2 WiFi module of a Rain Bird ESP-ME3 controller.
# MuseLab nanoESP32-C6 v1.0 board; wiring: ../CABLAGE_PROTOTYPE.md.
# Protocol: ../PROTOCOLE_ESP-ME3.md.

esphome:
  name: rainbird-me3
  friendly_name: Rain Bird ESP-ME3

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret rainbird_api_key
  actions:
    - action: lancer_zone
      variables:
        zone: int
        minutes: int
      then:
        - lambda: 'id(rainbird).run_zone(zone, minutes);'
    - action: lancer_programme
      variables:
        programme: int  # A = 0, B = 1, C = 2, D = 3
      then:
        - lambda: 'id(rainbird).run_program(programme);'
    - action: zone_suivante
      then:
        - lambda: 'id(rainbird).advance_zone();'
    - action: reveiller
      then:
        - lambda: 'id(rainbird).wake();'
    - action: arreter_arrosage
      then:
        - lambda: 'id(rainbird).stop_irrigation();'
    - action: programme_ecrire
      variables:
        programme: int    # A = 0 … D = 3
        frequence: int    # 0 chosen days, 2 odd, 3 even, 4 cyclic
        intervalle: int   # cyclic: every N days
        restants: int     # cyclic: days before the next watering
        jours: string     # 7 characters 0/1, Sunday first
        departs: string   # « 06:00,18:30 »
        durees: string    # « 3:1560,4:1560 » (zone:seconds)
        ajustement: int   # %
      then:
        - lambda: 'id(rainbird).write_program(programme, frequence, intervalle, restants, jours, departs, durees, ajustement);'
    - action: test_manchester
      variables:
        octets: string    # hexadecimal payload, e.g. « 0E 02 »
      then:
        - lambda: 'id(rainbird).test_manchester(octets);'
    - action: test_manchester_poignee
      then:
        - lambda: 'id(rainbird).test_manchester_handshake();'
    - action: test_uart
      variables:
        octets: string    # « 06 » alone = random challenge
      then:
        - lambda: 'id(rainbird).test_uart(octets);'
    - action: envoyer_brut
      variables:
        octets: string    # hexadecimal payload, e.g. « 3F 00 »
        ecriture: bool    # true if the command changes something (requires permission)
      then:
        - lambda: 'id(rainbird).send_hex(octets, ecriture);'

ota:
  - platform: esphome
    password: !secret rainbird_ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid_principal
      password: !secret wifi_password_principal
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: Rainbird-ME3 secours
    password: !secret rainbird_ota_password

captive_portal:

external_components:
  - source:
      type: local
      path: components

uart:
  id: uart_rainbird
  tx_pin: GPIO18   # → 220 Ω → cathode of the transmit opto (LED on = low level)
  rx_pin:          # ← emitter of the receive opto (1 kΩ to GND)
    number: GPIO19
    mode:
      input: true
      pulldown: true  # avoids false frames while the interface is not connected
  baud_rate: 9600
  rx_buffer_size: 1024   # configuration replies up to ~130 bytes
  data_bits: 8
  parity: NONE
  stop_bits: 1

rainbird_me3:
  id: rainbird
  uart_id: uart_rainbird
  update_interval: 15s
  model:
    name: Modèle
  controller_time:
    name: Heure du programmateur
  controller_date:
    name: Date du programmateur
  active_zones:
    name: Zones actives
  active_zone:
    name: Zone active
  rain_delay:
    name: Report d'arrosage
  irrigation_state:
    name: État d'arrosage
  rain_sensor:
    name: Sonde de pluie
  link:
    name: Liaison programmateur
  last_frame:
    name: Dernière trame reçue
    disabled_by_default: true

# Zones, commands, program editor: file generated by gen_entites.py
packages:
  entites: !include rainbird-me3-entites.yaml

sensor:
  - platform: wifi_signal
    name: Signal WiFi
    update_interval: 60s
  - platform: uptime
    name: Durée de fonctionnement

text_sensor:
  - platform: version
    name: Version ESPHome
